[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiguang"
version = "0.1.0"
description = "拾光 —— 记录代办、目标计划、习惯养成与每日复盘的 Windows 桌面应用"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "PySide6-Fluent-Widgets>=1.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shiguang = ["resources/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
