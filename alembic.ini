# Alembic migration config.
# The DB URL is NOT stored here: it is injected by db/migration_runner.py,
# or resolved lazily from shiguang.config.get_db_path() in env.py.

[alembic]
script_location = src/shiguang/db/migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

# Version file naming: 0001_xxx.py
file_template = %%(rev)s_%%(slug)s
